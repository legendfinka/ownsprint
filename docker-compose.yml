services:
  postgres:
    image: postgres:17-alpine
    container_name: ownsprint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ownsprint
      POSTGRES_PASSWORD: ownsprint
      POSTGRES_DB: ownsprint
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ownsprint -d ownsprint']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
