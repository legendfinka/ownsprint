name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ownsprint
          POSTGRES_PASSWORD: ownsprint
          POSTGRES_DB: ownsprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownsprint -d ownsprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Read by prisma.config.ts during `prisma generate`; no query is made with it.
      DATABASE_URL: postgresql://ownsprint:ownsprint@localhost:5432/ownsprint
      # The database the API tests run against (the service container above).
      TEST_DATABASE_URL: postgresql://ownsprint:ownsprint@localhost:5432/ownsprint_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The api postinstall script runs `prisma generate`.
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Applies migrations to the test database, then runs every test.
      - name: Test
        run: pnpm test
